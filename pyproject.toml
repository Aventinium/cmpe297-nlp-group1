[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cmpe297-chatbot"
version = "0.1.0"
description = "CMPE 297 Group 1 - MVP Chatbot (Ollama) with planned RAG + evaluation"
readme = "README.txt"
requires-python = ">=3.10"

# Keep core dependencies minimal for the baseline chatbot.
# Add heavier RAG/eval packages via optional-dependencies groups below.
dependencies = [
  "requests>=2.31.0",
  "rich>=13.7.0",
  "pydantic>=2.6.0",
]

[project.optional-dependencies]
# RAG dependencies (installed when you start RAG work)
rag = [
  # Document parsing
  "pypdf>=4.0.0",

  # Embeddings / retrieval helpers (heavier)
  "sentence-transformers>=3.0.0",
  "numpy>=1.24.0",
  "scikit-learn>=1.3.0",

  # Optional vector DB client (only if you use it)
  "qdrant-client>=1.9.0",
]

# Evaluation / experiment dependencies (installed when you start eval work)
eval = [
  "pandas>=2.0.0",
  "tqdm>=4.66.0",
  "matplotlib>=3.7.0",
  "tabulate>=0.9.0",

  # Common NLP evaluation helpers
  "rouge-score>=0.1.2",
  "sacrebleu>=2.4.0",
]

# Dev/test tooling (optional)
dev = [
  "pytest>=7.4.0",
  "pytest-cov>=4.1.0",
  "ruff>=0.5.0",
]

# Streamlit UI (thin layer over rag_local backend)
ui = [
  "streamlit>=1.31.0",
]

[tool.setuptools]
packages = ["rag_local"]

[project.scripts]
cmpe297-chat = "rag_local.chat:main"
